# Source of truth: dome-docs/templates/ci-website.yml — keep in sync.
# When changing this template, update: dome-website.
#
# Splitting `tsc -b --noEmit` and `vite build` (rather than running
# `npm run build`, which chains both) gives clearer failure attribution
# in the Actions log.

name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test
      - name: Type check (tsc)
        run: npx tsc -b --noEmit
      - name: Build (vite)
        run: npx vite build
